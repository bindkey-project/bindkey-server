apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: 
  name: bindkey
spec:
  parentRefs:
    - name: infra
      namespace: infra-gateway
      sectionName: websecure
  hostnames:
    - bindkey.cyber.lan
  rules:
    - backendRefs:
      - name: bindkey-service
        port: 8080

---

apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: bindkey-backend-tls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: bindkey-service
  backend:
    tls:
      insecureSkipVerify: All
      alpnProtocols: ["http/1.1"]