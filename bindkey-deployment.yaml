# --- 1. LE CLUSTER POSTGRESQL (Avec Chiffrement des Volumes) ---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bindkey-db
spec:
  instances: 1 
  imageName: ghcr.io/cloudnative-pg/postgresql:16.1
  imagePullSecrets:
    - name: ghcr-auth
  storage:
    size: 2Gi # Augmenté un peu pour la sécurité
    # Note: Si ton serveur Debian utilise LUKS, le volume est déjà chiffré au repos.
  
  # Configuration pour la gestion sécurisée des secrets
  bootstrap:
    initdb:
      database: bindkey
      owner: admin_bindkey 
      secret:
        name: bindkey-db-secrets
  managed:
    roles:
      - name: admin_bindkey
        ensure: present
        login: true
        passwordSecret:
          name: bindkey-db-secrets

---
# --- 2. L'API RUST (AVEC ARGO-CD IMAGE UPDATER) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bindkey-api-deployment
  annotations:
    # On remplace Keel par ArgoCD Image Updater (Méthode Pro)
    argocd-image-updater.argoproj.io/image-list: bindkey=ghcr.io/bindkey-project/bindkey-server/bindkey-server:latest
    argocd-image-updater.argoproj.io/bindkey.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: kubernetes
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: bindkey-api
  template:
    metadata:
      labels:
        app: bindkey-api
    spec:
      # Patch DNS pour s'assurer que le Pod peut contacter GitHub
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 1.1.1.1
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: bindkey-api
          image: ghcr.io/bindkey-project/bindkey-server/bindkey-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: bindkey-db-secrets, key: dburl }
            - name: PWD_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: bindkey-pwd-keys, key: PWD_ENCRYPTION_KEY } }
            - name: RUST_LOG
              value: "debug"

---
# --- 3. SERVICE PERMANENT (NODEPORT) ---
apiVersion: v1
kind: Service
metadata:
  name: bindkey-service
spec:
  type: NodePort 
  selector:
    app: bindkey-api
  ports:
    - port: 8080       
      targetPort: 8080 
      nodePort: 30080