# --- 1. LE CLUSTER POSTGRESQL (CloudNativePG) ---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bindkey-db
spec:
  instances: 1 
  imageName: ghcr.io/cloudnative-pg/postgresql:16.1
  imagePullSecrets:
    - name: ghcr-auth
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: bindkey
      owner: admin_bindkey 
      secret:
        name: bindkey-db-secrets
---
# --- 2. L'API RUST ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bindkey-api-deployment
spec:
  replicas: 1 # Un seul Pod API
  selector:
    matchLabels:
      app: bindkey-api
  template:
    metadata:
      labels:
        app: bindkey-api
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: bindkey-api
          image: ghcr.io/bindkey-project/bindkey-server/bindkey-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: bindkey-db-secrets, key: dburl }
            - name: PWD_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: bindkey-pwd-keys, key: PWD_ENCRYPTION_KEY } }
            - name: RUST_LOG
              value: "debug"
---
# --- 3. SERVICE POUR L'INGRESS ---
apiVersion: v1
kind: Service
metadata:
  name: bindkey-service
spec:
  selector:
    app: bindkey-api
  ports:
    - port: 8080
      targetPort: 8080