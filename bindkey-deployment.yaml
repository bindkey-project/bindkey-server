apiVersion: apps/v1
kind: Deployment
metadata:
  name: bindkey-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bindkey
  template:
    metadata:
      labels:
        app: bindkey
    spec:
      # On utilise le secret créé à l'étape précédente
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        # --- CONTENEUR 1 : LE SERVEUR RUST ---
        - name: server
          image: ghcr.io/bindkey-project/bindkey-server/bindkey-server:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgres://bindkey:bindkey@localhost:5432/bindkey"

        # --- CONTENEUR 2 : LA BASE DE DONNÉES ---
        - name: db
          image: ghcr.io/bindkey-project/bindkey-server/bindkey-db:latest
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: bindkey-service
spec:
  type: NodePort
  selector:
    app: bindkey
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080 # Le serveur sera accessible sur ce port