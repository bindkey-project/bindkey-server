name: Rust CI Quality & Security

on:
  push:
    branches: [ "develop", "marwa-version" ] # Surveillance de ta branche
  pull_request:
    branches: [ "develop", "marwa-version" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  security_and_quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2

    # ÉTAPE SÉCURITÉ : Vérifie les failles dans les librairies (axum, sqlx, etc.)
    - name: Installation de cargo-audit
      run: cargo install cargo-audit
    - name: Audit de sécurité des dépendances
      # On ignore la faille RSA/MySQL car nous utilisons PostgreSQL (Faux positif validé)
      run: cargo audit --ignore RUSTSEC-2023-0071

      # Ajouter Static Analysis

    # ÉTAPE QUALITÉ : Clippy  coder proprement
    - name: Analyse statique (Clippy)
      run: cargo clippy 

    # ÉTAPE TESTS : Exécution des tests de sécurité
    - name: Run Tests
      run: cargo test --verbose