name: Rust CI Quality & Security

on:
  push:
    branches: [ "develop", "marwa-version" ]
  pull_request:
    branches: [ "develop", "marwa-version" ]

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://bindkey:bindkey@localhost:5432/bindkey
  # On définit les noms d'images pour GHCR
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/bindkey-server
  DB_IMAGE: ghcr.io/${{ github.repository }}/bindkey-db

jobs:
  # --- JOB 1 : TESTS ET SÉCURITÉ ---
  security_and_quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bindkey      
          POSTGRES_PASSWORD: bindkey 
          POSTGRES_DB: bindkey        
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install OpenSSL (pour certificats de test)
      run: sudo apt-get update && sudo apt-get install -y openssl

    - name: Generate Temporary SSL Certs
      run: |
        openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -sha256 -days 1 -nodes \
        -subj "/C=FR/ST=Paris/L=Paris/O=BindKey/OU=Dev/CN=localhost"
        # Assure-toi que ton code Rust cherche bien ces noms de fichiers à la racine
        # ou configure les variables d'env correspondantes ci-dessous.

    - name: Audit de sécurité
      run: cargo audit --ignore RUSTSEC-2023-0071 || echo "Audit failed but continuing"

    - name: Analyse statique (Clippy)
      run: cargo clippy -- -D warnings

    - name: Run Unit Tests
      env:
        PWD_ENCRYPTION_KEY: ${{ secrets.PWD_ENCRYPTION_KEY }}
        DATABASE_URL: postgres://bindkey:bindkey@localhost:5432/bindkey
      run: cargo test --verbose

    # --- LE SMOKE TEST CRUCIAL ---
    - name: Verify Server Startup & Migrations Logic
      env:
        DATABASE_URL: postgres://bindkey:bindkey@localhost:5432/bindkey
        PWD_ENCRYPTION_KEY: ${{ secrets.PWD_ENCRYPTION_KEY }}
        # Variables d'env pour que ton code trouve les certs générés
        TLS_CERT_PATH: ./cert.pem
        TLS_KEY_PATH: ./key.pem
        RUST_LOG: debug # Pour voir les logs SQLx en cas d'erreur
      run: |
        echo "🚀 Lancement du serveur BindKey (Smoke Test)..."
        
        # On lance le serveur. S'il y a un panic de migration, il sera écrit ici.
        cargo run &> server_output.log &
        SERVER_PID=$!

        echo "⏳ Attente du signal : 🛡️ BindKey server running..."
        TIMEOUT=60
        while [ $TIMEOUT -gt 0 ]; do
          # 1. Check si le serveur est déjà opérationnel
          if grep -q "🛡️ BindKey SERVER running" server_output.log; then
            echo "✅ SUCCESS : Serveur en ligne et migrations OK !"
            kill $SERVER_PID
            exit 0
          fi

          # 2. Check si le serveur a crashé (Erreur SQL, Certs manquants, Panic)
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "❌ CRITICAL FAILURE : Le serveur a crashé !"
            echo "--- LOGS DU SERVEUR ---"
            cat server_output.log
            exit 1
          fi

          sleep 2
          TIMEOUT=$((TIMEOUT-2))
        done

        echo "❌ TIMEOUT : Le serveur n'a pas démarré après 60s"
        cat server_output.log
        kill $SERVER_PID || true
        exit 1

  # --- JOB 2 : BUILD ET PUSH DES IMAGES (GHCR) ---
  build_and_push:
    needs: security_and_quality # On ne build que si les tests passent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Indispensable pour pousser sur GHCR

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Construction de l'image du SERVEUR
    - name: Build and push Server Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ env.SERVER_IMAGE }}:latest,${{ env.SERVER_IMAGE }}:${{ github.sha }}

    # Construction de l'image de la DATABASE
    - name: Build and push DB Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.db
        push: true
        tags: ${{ env.DB_IMAGE }}:latest,${{ env.DB_IMAGE }}:${{ github.sha }}