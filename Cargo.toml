# ─────────────────────────────────────────────
# Informations générales du projet Rust
# ─────────────────────────────────────────────
[package]
name = "bindkey-server"       # Nom du binaire généré
version = "0.1.0"             # Version de l’application
edition = "2024"              # Édition Rust utilisée

# ─────────────────────────────────────────────
# Dépendances Rust utilisées par le projet
# ─────────────────────────────────────────────
[dependencies]

# Framework web pour créer l’API HTTP
axum = "0.7"

# Serveur HTTPS basé sur Rustls
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"

# Runtime asynchrone pour Axum + SQLx
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }

# Logs
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Variables d’environnement depuis .env
dotenvy = "0.15"

# PostgreSQL async + UUID + chrono + migrations
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "migrate", "macros"] }

# JSON
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# UUID
uuid = { version = "1.19.0", features = ["v4", "serde"] }

# Dates / timestamps
chrono = { version = "0.4.42", features = ["serde"] }
time = "0.3.47"

# Utilitaires Axum/Tower
tower = { version = "0.5.3", features = ["util"] }

# Génération aléatoire sécurisée
rand = "0.9.2"

# Certificats TLS / X.509
rcgen = { version = "0.13.2", features = ["pem", "x509-parser"] }
pem = "3.0"
ring = "0.17"

# Chiffrement AES-GCM
aes-gcm = "0.10.3"

# Encodage / décodage
base64 = "0.22"
hex = "0.4"

# Hash mot de passe
argon2 = "0.5"

# Hash SHA-256 des tokens de session
sha2 = "0.10"

# Cryptographie signatures / courbes
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = "0.16"
ed25519-dalek = "2.2.0"

# Client HTTP pour tests ou appels externes
reqwest = { version = "0.13.1", features = ["json"] }

# Tests API Axum
axum-test = "16.4.0"

# Gestion d’erreurs
thiserror = "2.0.18"

# ⚠️ À vérifier : dépendance probablement inutile ou faute de frappe.
# Supprime-la si elle n’est pas utilisée.
ran = "2.0.1"

# ─────────────────────────────────────────────
# Librairie principale
# ─────────────────────────────────────────────
[lib]
name = "bindkey_server"
path = "src/lib.rs"

# ─────────────────────────────────────────────
# Binaire serveur
# ─────────────────────────────────────────────
[[bin]]
name = "bindkey-server"
path = "src/main.rs"

# ─────────────────────────────────────────────
# Tests d’intégration
# ─────────────────────────────────────────────
[[test]]
name = "bindkey_tests"
path = "Tests/bindkey_tests.rs"

# ─────────────────────────────────────────────
# Features
# ─────────────────────────────────────────────
[features]
skip-auth = []

# ─────────────────────────────────────────────
# Dépendances de développement / tests
# ─────────────────────────────────────────────
[dev-dependencies]
bindkey-server = { path = ".", features = ["skip-auth"] }