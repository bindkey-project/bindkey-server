apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bindkey-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: api.bindkey.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bindkey-service
            port:
              number: 8080